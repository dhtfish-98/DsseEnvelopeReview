[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cvp-dsse-envelope-review"
version = "0.1.2"
authors = [{name = "dhtfish98"}]
description = "Ed25519 DSSE v1 envelope verification against explicit pinned public keys, expected payload type and independent-key threshold."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "UPSTREAM_LICENSE"]
readme = "README.md"
dependencies = ["cryptography==50.0.2", "PyNaCl==1.6.2"]
[project.scripts]
dsse-envelope-review = "dsse_envelope_review.cli:entry"
[tool.setuptools.packages.find]
where = ["src"]
